# Optional DeepSeek Web provider over the base composition. A saved
# agent-default-model setting, when present, still wins over this bundle value.

- id: agent-default-model
  config:
    provider: deepseek-web
    model: default

- insert:
    - id: llm-deepseek-web-free
      name: dsh-deepseek-web-free
    - id: deepseek-web-free-tui
      name: dsh-deepseek-web-free/tui
      inject: [deepSeekWeb]
